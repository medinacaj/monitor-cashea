name: Pruebas de calidad

on:
  push:
    branches: [main]
    paths-ignore:
      - 'status.json'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis de JavaScript
        run: |
          node --check app.js
          node --check calculator-options.js
          node --check finance.js
          node --check monitor-chart.js
          node --check scripts/check.mjs
      - name: Validar directorio
        run: npm run validate:data
      - name: Ejecutar pruebas
        run: npm test

  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar navegador de prueba
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium webkit
      - name: Levantar web estática
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/monitor-cashea-web.log 2>&1 &
      - name: Validar responsive real y controles
        run: node scripts/test-responsive.mjs
