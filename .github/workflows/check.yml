name: Comprobar sitio público

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check.yml'
      - 'scripts/check.mjs'
      - 'scripts/status-core.mjs'
      - 'scripts/secondary-observer.mjs'
      - 'targets.json'

permissions:
  contents: write

concurrency:
  group: monitor-web-main
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consultar la web pública
        env:
          SECONDARY_OBSERVER_FEED_URL: ${{ secrets.SECONDARY_OBSERVER_FEED_URL }}
          SECONDARY_OBSERVER_TOKEN: ${{ secrets.SECONDARY_OBSERVER_TOKEN }}
          SECONDARY_OBSERVER_NETWORK_ID: ${{ vars.SECONDARY_OBSERVER_NETWORK_ID }}
          SECONDARY_OBSERVER_AUTHORIZED: ${{ vars.SECONDARY_OBSERVER_AUTHORIZED }}
        run: node scripts/check.mjs
      - name: Publicar el registro
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(status): actualizar datos del monitor [skip ci]"
            git push
          fi
